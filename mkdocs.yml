site_name: rulfo
site_url: https://cardona-oss.gitlab.io/rulfo/
site_description: "Messaging between processes where a request gets zero, one or many replies and always an end"
repo_url: https://gitlab.com/cardona-oss/rulfo
repo_name: cardona-oss/rulfo
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
      dedent_subsections: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# docs/issues/ is the follow-up register (`cabildo issues`), read in the repo, not published:
# its links point at source files that are not part of the site, so --strict would fail on them.
exclude_docs: |
  issues/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            heading_level: 3
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: spacy
  - llmstxt:
      markdown_description: >-
        Messaging between processes where a request gets zero, one or many replies and always an
        end. A Python package on a C core, for asyncio.
      full_output: llms-full.txt
      sections:
        Guide:
          - index.md
          - quickstart.md
          - python.md
          - server.md
          - transports.md
          - errors.md
          - testing.md
        Protocol:
          - operations.md
          - wire-format.md
          - model.md
        API reference:
          - api.md

nav:
  - Home: index.md
  - Guide:
    - Quickstart: quickstart.md
    - Peer: python.md
    - Server: server.md
    - Transports: transports.md
    - Errors: errors.md
    - Testing: testing.md
  - Protocol:
    - Operations: operations.md
    - Wire format: wire-format.md
    - Model: model.md
  - API reference: api.md
  - Changelog: changelog.md
