[project]
name = "rulfo"
dynamic = ["version"]  # the single source of truth is __version__ in src/rulfo/__init__.py (see [tool.hatch.version])
description = "Messaging between processes where a request gets zero, one or many replies and always an end"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = ["messaging", "request-reply", "ipc", "asyncio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["cffi>=2.0"]

[project.optional-dependencies]
# docs are an *extra* (not a uv dependency-group) so Read the Docs can install them via pip
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-llmstxt>=0.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/rulfo"
Repository = "https://gitlab.com/cardona-oss/rulfo"
Documentation = "https://cardona-oss.gitlab.io/rulfo/"
Changelog = "https://gitlab.com/cardona-oss/rulfo/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/cardona-oss/rulfo/-/issues"

[build-system]
requires = ["hatchling", "cffi>=2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/rulfo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rulfo"]

# hatch_build.py compiles core/ into src/rulfo/_core.abi3.so, which git ignores.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "core", "scripts/core-test", "scripts/core-fuzz", "scripts/test-python", "models", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
# The version is dynamic (hatchling reads __version__ from the file below), so uv must watch it too:
# declaring cache-keys REPLACES uv's defaults, so pyproject.toml is listed explicitly alongside it.
# Without __init__.py here, bumping the version would not trigger an editable reinstall.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/rulfo/__init__.py" },
    { file = "hatch_build.py" },
    { file = "core/include/*.h" },
    { file = "core/src/*.c" },
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "prodc>=0.11.4,<0.12",
    "musil>=0.36.12",
    "pytest-parallex>=0.2.8",
    "hatchling",
    "websockets>=15",
    "litestar>=2.25",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["models"]
# Two forked workers: the model checks take most of the time, and two leave the machine usable.
addopts = "-q --parallel=fork --parallel-workers=2"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "models", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# The canonical base ignore list shared across the oss/ libraries. E501 (line length) is handled by
# the formatter; COM812/ISC001 conflict with the formatter; D1/D401 relax docstring presence/mood;
# TRY003/EM101/EM102 allow inline exception messages; CPY001 drops the copyright-header demand;
# PLC0415 allows non-top-level imports; TC001/TC002/TC003 don't force type-only import blocks.
ignore = [
    "E501",
    "COM812",
    "ISC001",
    "D1",
    "D401",
    "TRY003",
    "EM101",
    "EM102",
    "CPY001",
    "PLC0415",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests may assert (S101), use magic values (PLR2004), take unused fixtures (ARG), pass Any to typed
# calls (ANN401), and group assertions pytest would otherwise split (PT018).
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "ANN401", "PT018"]
# A model prints its verdicts when run as a script (T201).
"models/**/*.py" = ["T201"]
# An example is a script that a reader runs (INP001) and that prints (T201). A handler takes a
# request also when it does not read it (ARG001). The example tests assert (S101, PLR2004).
"examples/**/*.py" = ["INP001", "T201", "ARG001", "S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["rulfo"]

[tool.pyright]
include = ["src", "models", "tests", "examples"]
extraPaths = ["src", "models"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
